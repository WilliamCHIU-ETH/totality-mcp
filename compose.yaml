name: transcript-mcp
services:
  rag-db:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    platform: linux/arm64
    environment:
      POSTGRES_DB: totality
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password, reader_password, loader_password]
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./deploy/init-reader.sh:/docker-entrypoint-initdb.d/20-reader.sh:ro
    networks: [db_internal]
    # Deliberately no published database port.
    mem_limit: 1g
    cpus: 0.50
    pids_limit: 128
    shm_size: 128m
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, max_connections=15, -c, max_parallel_maintenance_workers=0]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d totality']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  rag-mcp:
    build: .
    platform: linux/arm64
    command: [--transport, streamable-http]
    environment:
      RAG_BACKEND: postgres
      RAG_DATA: /app/data
      RAG_DSN_FILE: /run/secrets/reader_dsn
      RAG_HTTP_HOST: 0.0.0.0
      RAG_HTTP_PORT: '8765'
      RAG_PRIVATE_NETWORK_CONFIRMED: '1'
      RAG_HTTP_TOKEN_FILE: /run/secrets/mcp_token
      RAG_HTTP_ALLOWED_HOSTS: '127.0.0.1:8765,localhost:8765,rag-mcp:8765'
      RAG_HTTP_ALLOWED_ORIGINS: 'http://127.0.0.1:8765,http://localhost:8765'
    secrets: [reader_dsn, mcp_token]
    volumes: ['./data:/app/data:ro']
    networks: [db_internal, mcp_private]
    ports: ['127.0.0.1:8765:8765']
    depends_on:
      rag-db: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  loader:
    profiles: [import]
    build: .
    platform: linux/arm64
    entrypoint: [python, /app/import_pg.py]
    command: [--dsn-file, /run/secrets/loader_dsn]
    environment: {RAG_DATA: /app/data}
    secrets: [loader_dsn]
    volumes: ['./data:/app/data:ro']
    networks: [db_internal]
    depends_on:
      rag-db: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    cpus: 0.25
    pids_limit: 64
networks:
  db_internal: {internal: true}
  mcp_private: {driver: bridge}
volumes:
  rag_pgdata: {}
secrets:
  pg_password: {file: ./.secrets/pg_password}
  reader_password: {file: ./.secrets/reader_password}
  reader_dsn: {file: ./.secrets/reader_dsn}
  owner_dsn: {file: ./.secrets/owner_dsn}
  loader_password: {file: ./.secrets/loader_password}
  loader_dsn: {file: ./.secrets/loader_dsn}
  mcp_token: {file: ./.secrets/mcp_token}
