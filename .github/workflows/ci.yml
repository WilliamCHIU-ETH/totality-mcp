name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Offline synthetic tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_synthetic.py
      - name: Probe script compiles
        run: python -m py_compile tools/probe.py
      - name: Compose file is valid
        run: |
          mkdir -p .secrets
          for f in pg_password reader_password loader_password reader_dsn loader_dsn owner_dsn mcp_token; do : > ".secrets/$f"; done
          docker compose config --quiet
